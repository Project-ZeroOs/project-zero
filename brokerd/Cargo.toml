[package]
name = "brokerd"
version = "0.1.0"
edition = "2021"
authors = ["ZeroOS Architecture Team"]
description = "ZeroOS System Service Directory & Capability Broker Daemon"

[[bin]]
name = "brokerd"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
libzero = { path = "../libzero" }

[package]
name = "deviced"
version = "0.1.0"
edition = "2021"
authors = ["ZeroOS Architecture Team"]
description = "ZeroOS Device Discovery, PCI/ACPI Topology & Physical Device Registry Daemon"

[[bin]]
name = "deviced"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
libzero = { path = "../libzero" }
